[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mosaivue"
version = "0.1.0b2"
description = "Local-first camera wall appliance for Raspberry Pi and Linux"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Mosaivue contributors"}]
keywords = ["rtsp", "raspberry-pi", "gstreamer", "surveillance", "camera-wall"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Display",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "sqlalchemy==2.0.38",
  "alembic>=1.14,<2",
  "pydantic>=2.9,<3",
  "typer>=0.15,<1",
  "cryptography>=50.0.2,<51",
  "psutil>=6,<8",
  "python-multipart>=0.0.12,<1",
  "httpx>=0.27,<1",
  "rich>=13.9,<15",
  "textual>=1.0,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "playwright>=1.50,<2",
  "packaging>=24,<26",
]

[project.urls]
Homepage = "https://github.com/the-vibe-dev/mosaivue"
Documentation = "https://github.com/the-vibe-dev/mosaivue/tree/main/docs"
Repository = "https://github.com/the-vibe-dev/mosaivue"
Issues = "https://github.com/the-vibe-dev/mosaivue/issues"

[project.scripts]
mosaivue = "mosaivue.cli:app"
mosaivue-server = "mosaivue.api.app:main"
mosaivue-renderer = "mosaivue.renderer.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaivue"]
artifacts = ["src/mosaivue/static/**"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["frontend/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["mosaivue"]
branch = true
