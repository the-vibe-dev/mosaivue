name: Camera compatibility
description: Report an RTSP/codec/camera-specific issue
title: "[camera] "
labels: [camera-compatibility]
body:
  - type: input
    id: camera
    attributes: {label: Camera or NVR vendor/model/firmware}
    validations: {required: true}
  - type: input
    id: stream
    attributes: {label: Codec, resolution, FPS, and transport}
    validations: {required: true}
  - type: textarea
    id: probe
    attributes: {label: Sanitized Test Stream output}
  - type: textarea
    id: issue
    attributes: {label: Reproduction and behavior}
    validations: {required: true}
