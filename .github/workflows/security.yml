name: Security and licenses
on:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e . pip-audit bandit
      - run: bandit -q -r src/mosaivue -x src/mosaivue/static
      - run: pip-audit
      - run: python scripts/license_inventory.py --output dependency-licenses.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-license-inventory
          path: dependency-licenses.json
